[package]
name = "keypad"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "KeyPad — klávesnice jako virtuální Xbox ovladač (Tauri 2)"

[[bin]]
name = "KeyPad"
path = "src/main.rs"

[build-dependencies]
tauri-build = { workspace = true }

[dependencies]
keypad-core = { workspace = true }
updater = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
log = { workspace = true }
crossbeam-channel = { workspace = true }
# tray-icon: ikona v oznamovací oblasti — zavření okna KeyPad jen
# schová (jako WinSent), virtuální pad mezitím zůstává připojený.
tauri = { workspace = true, features = ["tray-icon"] }
# Druhé spuštění nevyrobí další proces — jen ukáže okno toho běžícího.
tauri-plugin-single-instance = { workspace = true }
# Schované okno: WebView2 dostane cíl „málo paměti" (princip 10).
webview2-com = { workspace = true }

# Win32: okno (DWM, vyzdvižení), místní čas do logu, hláška při
# nespuštění (MessageBox) a Fáze 2 — vlastní klient ViGEmBus (CfgMgr32
# hledá rozhraní, overlapped DeviceIoControl s časovým limitem), uspání
# (Power), pojmenovaná událost pro ukončení z instalátoru (Threading),
# spuštění instalátoru ViGEmBus a odkazů (Shell), skryté okno pro konec
# relace Windows (WindowsAndMessaging) a build Windows pro pozadí okna
# (Wdk: RtlGetVersion z ntdll — tentýž import, který už má Tauri).
# XboxController jen kvůli konstantám XINPUT_GAMEPAD_* v testech
# a XInputGetState v příkladu pad_selftest — KeyPad.exe sám
# xinput1_4.dll neimportuje (windows-rs linkuje jen funkce, které se
# opravdu volají).
[dependencies.windows]
workspace = true
features = [
    "Wdk_System_SystemServices",
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Devices_DeviceAndDriverInstallation",
    "Win32_Graphics_Dwm",
    # jen příklad pad_selftest (kontrola celoobrazovkového okna)
    "Win32_Graphics_Gdi",
    # zvuk pozastavení přes WASAPI (objekty COM, žádný statický import);
    # IMMDevice::Activate potřebuje i StructuredStorage a Variant
    # (PROPVARIANT) — ty už zapíná wry, tady jen výslovně
    "Win32_Media_Audio",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_IO",
    # SetDefaultDllDirectories — DLL za běhu jen ze System32
    "Win32_System_LibraryLoader",
    "Win32_System_Power",
    # K32GetProcessMemoryInfo (kernel32) — paměť před prvním zvukem a po
    # něm do logu
    "Win32_System_ProcessStatus",
    # jen testy: hook a okna testů na skryté ploše, ne na ploše vlastníka
    "Win32_System_StationsAndDesktops",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_System_Time",
    "Win32_System_Variant",
    # SetWinEventHook — přepnutí plochy (UAC, Ctrl+Alt+Del) v hook vlákně
    "Win32_UI_Accessibility",
    # Get/RegisterRawInputDevices — proces nesmí mít klávesnici v Raw
    # Input, jinak Windows s oknem KeyPadu v popředí jeho hook podle cizích
    # nálezů nevolají (raw_input.rs, OQ 60; přímo neověřeno, pravidlo
    # platí preventivně). Obě funkce má user32 od XP.
    "Win32_UI_Input",
    # GetKeyNameTextW — názvy kláves podle rozložení
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Input_XboxController",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
]
