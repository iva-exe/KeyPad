<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- KeyPad: neonový obrys gamepadu ve stylu ikony WinSentu (tah se
       zeleno-azurovým přechodem, jemná záře, slabá výplň). Vlevo kříž
       D-padu, vpravo klávesa — klávesnice, která se stane padem.
       Zdroj pro `tauri icon`; tahy jsou tlusté schválně, aby ikona
       přežila zmenšení na 16–32 px. -->
  <defs>
    <linearGradient id="tah" x1="0" y1="270" x2="0" y2="780" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#8ef5b0"/>
      <stop offset="0.5" stop-color="#4ee6b0"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <linearGradient id="vypln" x1="0" y1="270" x2="0" y2="780" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#c8ffe0" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#a5f3fc" stop-opacity="0.18"/>
    </linearGradient>
    <filter id="zare" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="22" result="rozmazane"/>
      <feMerge>
        <feMergeNode in="rozmazane"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <path id="telo" d="M 330 271 L 694 271 C 770 271 832 325 846 399 L 900 643 C 914 707 868 755 808 751 C 772 749 750 731 728 703 L 680 639 C 664 619 644 609 616 609 L 408 609 C 380 609 360 619 344 639 L 296 703 C 274 731 252 749 216 751 C 156 755 110 707 124 643 L 178 399 C 192 325 254 271 330 271 Z"/>
  </defs>

  <!-- slabá výplň těla -->
  <use href="#telo" fill="url(#vypln)"/>

  <!-- neonové tahy se září -->
  <g filter="url(#zare)" fill="none" stroke="url(#tah)" stroke-linecap="round" stroke-linejoin="round">
    <use href="#telo" stroke-width="54"/>
    <!-- D-pad -->
    <path d="M 262 440 H 398 M 330 372 V 508" stroke-width="50"/>
    <!-- klávesa -->
    <rect x="630" y="376" width="128" height="128" rx="30" stroke-width="44"/>
  </g>

  <!-- světlé jádro tahu — „trubice" neonu -->
  <g fill="none" stroke="#f0fff8" stroke-opacity="0.55" stroke-linecap="round" stroke-linejoin="round">
    <use href="#telo" stroke-width="14"/>
    <path d="M 262 440 H 398 M 330 372 V 508" stroke-width="12"/>
    <rect x="630" y="376" width="128" height="128" rx="30" stroke-width="10"/>
  </g>
</svg>
