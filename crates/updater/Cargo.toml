[package]
name = "updater"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "KeyPad — kanál vydání na GitHubu (WinHttp) a cesty instalace; sdílí ho instalátor i aplikace"

# Stahování jde přes WinHttp (součást Windows) — žádná TLS knihovna
# navíc, žádné vlastní úložiště certifikátů, menší binárky.
[dependencies.windows]
workspace = true
features = [
    "Win32_Foundation",
    "Win32_Networking_WinHttp",
    # SHA-256 přes CNG (bcrypt.dll) — ověření instalátoru ViGEmBus bez
    # vlastní kryptografie a bez crate navíc (src/sha256.rs).
    "Win32_Security_Cryptography",
    # Stav ViGEmBus jen čtením: rozhraní a zařízení sběrnice (cfgmgr32),
    # služba a záznam v Aplikacích (registr) — src/vigembus.rs.
    "Win32_Devices_DeviceAndDriverInstallation",
    "Win32_System_Registry",
]
